apiVersion: apps/v1
kind: Deployment
metadata:
  name: lms-portal-deployment
  labels:
    app: lms-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lms-portal
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: lms-portal
    spec:
      containers:
      - name: lms-portal-container
        image: YOUR_DOCKERHUB_USERNAME/lms-portal:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /index.html
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 5
          failureThreshold: 2
        livenessProbe:
          httpGet:
            path: /index.html
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: lms-portal-service
spec:
  type: NodePort
  selector:
    app: lms-portal
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
    nodePort: 30080
